# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm decompiles Minecraft on first run and needs headroom.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# NeoForge 1.21.1 port of Tinkers' Planner (upstream by Tiffit/SpikyStars).
# mod_version tracks the upstream planner version it derives from.
mod_version=1.2.0
# fork_version is THIS fork's release number; bump it every published release (1.0 -> 1.1 -> 1.2 ...).
# Final version string and jar name = <minecraft_version>-<mod_version>-v<fork_version>.
fork_version=1.0

# Minecraft Version Information
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
# loader_range tracks the FML version, not the NeoForge version.
loader_range=[4,)
neoforge_version=21.1.233
neoforge_range=[21.1.0,)

# Parchment mappings for 1.21.1
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Sibling NeoForge 1.21.1 dependencies (substituted via composite build, see settings.gradle).
# The version strings here are nominal; composite substitution resolves by group:module.
mantle_version=1.21.0
mantle_range=[1.21.0,)
tconstruct_version=3.11.2
# NeoForge compares this range against TConstruct's full version string (<mc>-<modver>-v<fork>,
# e.g. 1.21.1-3.11.2-v1.2), which is parsed leading with the MC version. Mirror NeoMantle's scheme.
tconstruct_range=[1.21.0,)
