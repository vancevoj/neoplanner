# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# NeoForge 1.21.1 port of Tinkers' Planner (upstream by Tiffit/SpikyStars), rebranded "Neo Planner".
# mod_version tracks the upstream planner version it derives from.
mod_version=1.2.0
# fork_version is THIS fork's release number; bump it every published release (1.0 -> 1.1 -> 1.2 ...).
# Final version string and jar name = <minecraft_version>-<mod_version>-v<fork_version>.
# 1.3: rebuilt against the shipped Neo Tinkers v1.25 / Neo Mantle v1.23-dev API. The v1.2 jar was compiled against
# the far older fork v1.17, and that dependency skew made the planner render Tinkers tool/part/modifier icons as
# magenta missing-texture placeholders against the newer Tinkers client API. Realigning the compile deps fixes it.
fork_version=1.3

# Minecraft Version Information
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
# loader_range tracks the FML version, not the NeoForge version.
loader_range=[4,)
neoforge_version=21.1.233
neoforge_range=[21.1.0,)

# Parchment mappings for 1.21.1
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Dependencies: the published NeoForge 1.21.1 release jars of Neo Tinkers' Construct + Neo Mantle.
# <dep>_version is the upstream mod version; <dep>_fork is the sibling fork release (the GitHub release tag is v<fork>).
# These pin the libs/ jars fetched by the downloadModDeps task: Neo<Name>-<mc>-<dep_version>-v<dep_fork>.jar.
mantle_version=1.21.0
mantle_fork=1.23-dev
tconstruct_version=3.11.2
tconstruct_fork=1.25
# NeoForge compares this range against TConstruct's full version string (<mc>-<modver>-v<fork>,
# e.g. 1.21.1-3.11.2-v1.2), which is parsed leading with the MC version. Mirror NeoMantle's scheme.
tconstruct_range=[1.21.0,)
