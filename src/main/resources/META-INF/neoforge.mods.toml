modLoader="javafml"
loaderVersion="${loader_range}"
license="MIT License"
issueTrackerURL="https://github.com/vancevoj/neoplanner/issues"

[[mods]]
    modId="neoplanner"
    version="${version}"
    displayName="Neo Planner"
    logoFile="logo.png"
    authors="Tiffit, SpikyStars, vancevoj"
    # Ignore version checks so the client still connects to vanilla / mod-less servers (bookmark sync is optional).
    displayTest="IGNORE_ALL_VERSION"
    description='''
Neo Planner lets you try out different material and modifier combinations for Tinkers' Construct tools before actually making the tool. Saved designs persist server-side per player on servers that also run Neo Planner, and fall back to a local file otherwise. vancevoj's NeoForge 1.21.1 rebrand/port of Tiffit & SpikyStars' Tinkers' Planner ${mod_version}.
    '''
    displayURL="https://github.com/vancevoj/neoplanner"

[[dependencies.neoplanner]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.neoplanner]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.neoplanner]]
    modId="tconstruct"
    type="required"
    versionRange="${tconstruct_range}"
    ordering="NONE"
    side="CLIENT"
