/*
 * Neo Planner - NeoForge 1.21.1 build file.
 * Original ForgeGradle 1.18.2 build by Tiffit / SpikyStars.
 * Converted to ModDevGradle for NeoForge 1.21.1, matching the NeoTinkersConstruct / NeoMantle ports.
 */

plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'net.tiffit.tconplanner'
// version = <mc>-<upstream planner version>-v<fork version>, e.g. 1.21.1-1.2.0-v1.1
version = "${minecraft_version}-${mod_version}-v${fork_version}"
base {
    archivesName = 'NeoPlanner'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

repositories {
    mavenCentral()
    maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// --- Neo Planner depends on the published NeoForge 1.21.1 releases of Neo Tinkers' Construct
// --- and Neo Mantle. Their jars are fetched from the GitHub releases tab into libs/ (gitignored)
// --- by the downloadModDeps task below, then put on the compile + dev-run classpath.
def mantleJar = file("libs/NeoMantle-${minecraft_version}-${mantle_version}-v${mantle_fork}.jar")
def tconstructJar = file("libs/NeoTinkersConstruct-${minecraft_version}-${tconstruct_version}-v${tconstruct_fork}.jar")

tasks.register('downloadModDeps') {
    description = "Fetch the Neo Tinkers' Construct + Neo Mantle release jars into libs/"
    outputs.files(mantleJar, tconstructJar)
    doLast {
        file('libs').mkdirs()
        def downloads = [
            [mantleJar,     "https://github.com/vancevoj/neomantle/releases/download/v${mantle_fork}/${mantleJar.name}"],
            [tconstructJar, "https://github.com/vancevoj/NeoTinkersConstruct/releases/download/v${tconstruct_fork}/${tconstructJar.name}"],
        ]
        downloads.each { dest, url ->
            if (!dest.exists()) {
                logger.lifecycle("Downloading ${url}")
                ant.get(src: url, dest: dest)
            }
        }
    }
}
tasks.named('compileJava').configure { dependsOn 'downloadModDeps' }

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
    }

    mods {
        neoplanner {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Neo Tinkers' Construct + Neo Mantle (1.21.1 release jars from libs/, see downloadModDeps).
    implementation files(tconstructJar, mantleJar)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version        : version,
        mod_version    : mod_version,
        fork_version   : fork_version,
        loader_range   : loader_range,
        minecraft_range: minecraft_range,
        neoforge_range : neoforge_range,
        tconstruct_range: tconstruct_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"   : "Neo Planner",
                "Specification-Vendor"  : "Tiffit",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : "vancevoj"
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
